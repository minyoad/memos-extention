name: Package Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        run: |
          mkdir -p dist
          zip -r dist/memos-extension-v${{ steps.version.outputs.version }}.zip \
            _locales/ \
            assets/ \
            css/ \
            js/ \
            popup.html \
            manifest.json \
            LICENSE \
            -x "*.git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memos-extension-v${{ steps.version.outputs.version }}
          path: dist/memos-extension-v${{ steps.version.outputs.version }}.zip

      # 只在推送 tag 时才创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/memos-extension-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
